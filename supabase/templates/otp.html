<div style="font-family: -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #0E1116">
  <p style="font-size: 14px; letter-spacing: 0.12em; color: #5B6470; margin: 0 0 4px">SPRINT TIMER</p>
  <h1 style="font-size: 22px; margin: 0 0 16px">短跑計時 登入驗證碼</h1>
  <p style="font-size: 16px; line-height: 1.6; margin: 0 0 16px">回到 App 輸入這 6 個數字就能登入：</p>
  <p style="font-size: 40px; font-weight: 700; letter-spacing: 0.2em; background: #F2F4F7; border-radius: 12px; padding: 16px; text-align: center; margin: 0 0 16px">{{ .Token }}</p>
  <p style="font-size: 14px; line-height: 1.6; color: #5B6470; margin: 0">驗證碼 1 小時內有效，只能用一次。如果不是你本人要登入，不用理會這封信。</p>
</div>

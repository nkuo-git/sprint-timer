name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 版本號依上一個 Release 計算，同時只跑一個以免兩次建置拿到同一個版本號
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh api "repos/${{ github.repository }}/releases?per_page=100" | node scripts/next-version.mjs)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V (versionCode ${{ github.run_number }})"
      - run: npx expo prebuild --platform android --no-install
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: sprint-timer-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      # main 分支每次建置都發一個 Release，標題是顯示版本 v0.N，APK 檔名固定為 sprint-timer.apk，
      # 所以最新版永遠是：https://github.com/<owner>/<repo>/releases/latest/download/sprint-timer.apk
      # 標籤維持 build-<versionCode>：已安裝的舊版 App 靠這個格式判斷有沒有新版。
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sprint-timer.apk
          gh release create "build-${{ github.run_number }}" sprint-timer.apk \
            --target "${{ github.sha }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes "自動建置：${COMMIT_MSG%%$'\n'*}" \
            --latest

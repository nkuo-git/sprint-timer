name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # 雲端資料庫的權限規則（誰看得到、改得到哪些成績）：在 Firebase 模擬器上用真的 firestore.rules 把雲端相關的測試再跑一次
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cloud permission tests (Firebase emulator)
        run: npm run test:cloud

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 版本號依上一個 Release 計算，同時只跑一個以免兩次建置拿到同一個版本號
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(gh api "repos/${{ github.repository }}/releases?per_page=100" | node scripts/next-version.mjs)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V (versionCode ${{ github.run_number }})"
      # 先產生手機 App 的 Android 專案：手錶版要用同一把簽章金鑰（android/app/debug.keystore），
      # 兩個 App 套件名和簽章都相同，手機才能透過配對連線看手錶版本、幫手錶更新。
      - run: npx expo prebuild --platform android --no-install
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
      # 手錶版（Wear OS）起點機：獨立的原生專案，版本號和手機 App 同一組。放在手機建置前面，有錯可以早點知道。
      - name: Watch app unit tests
        working-directory: wear
        run: ./gradlew :core:test --no-daemon
      - name: Build watch APK
        working-directory: wear
        run: ./gradlew :app:assembleRelease --no-daemon -PappVersion=${{ steps.ver.outputs.version }} -PbuildNumber=${{ github.run_number }} -PsigningStore=${{ github.workspace }}/android/app/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: sprint-timer-wear-apk
          path: wear/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: sprint-timer-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      # 手機和手錶的安裝檔必須是同一個套件名、同一把簽章，否則裝得起來但兩邊連不上。不一樣就不要發佈。
      - name: Check phone and watch APKs can talk to each other
        run: node scripts/check-apk-pair.mjs android/app/build/outputs/apk/release/app-release.apk wear/app/build/outputs/apk/release/app-release.apk
      # main 分支每次建置都發一個 Release，標題是顯示版本 v0.N，APK 檔名固定為 sprint-timer.apk，
      # 所以最新版永遠是：https://github.com/<owner>/<repo>/releases/latest/download/sprint-timer.apk
      # 手錶版同一個 Release，檔名固定為 sprint-timer-wear.apk。
      # 標籤維持 build-<versionCode>：已安裝的舊版 App 靠這個格式判斷有沒有新版。
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sprint-timer.apk
          cp wear/app/build/outputs/apk/release/app-release.apk sprint-timer-wear.apk
          gh release create "build-${{ github.run_number }}" sprint-timer.apk sprint-timer-wear.apk \
            --target "${{ github.sha }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes "自動建置：${COMMIT_MSG%%$'\n'*}" \
            --latest
